# SAR Generator Default Configuration
simulation:
  start_time: "2024-01-01 00:00:00"
  end_time: "2024-01-02 00:00:00"
  interval_seconds: 300  # 5 dakika

nodes:
  - type: "compute"
    count: 5
    base_load: 0.4

  - type: "ceph_storage"
    count: 3
    base_load: 0.6

output:
  format: "csv"
  directory: "output_data"